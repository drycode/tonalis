name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Python port: the pure language core + its in-package tests + the dsl-core conformance runner.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable, music-dsl first)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./music-dsl/python[dev]"
          pip install -e ./leadsheet/python pytest

      - name: MusicDSL tests
        run: pytest music-dsl/python/tests -q

      - name: Leadsheet unit tests + import-boundary guard
        run: pytest leadsheet/python/tests -q

      - name: dsl-core conformance (Python reference)
        run: pytest conformance/dsl-core/runners/python -q

      - name: MusicDSL conformance (Python reference)
        run: pytest conformance/music-dsl/runners/python -q

  # TypeScript port: units + import-boundary guard + the dsl-core conformance runner.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install + test
        working-directory: leadsheet/ts
        run: |
          npm ci
          npm test

      - name: MusicDSL TS port + conformance
        working-directory: music-dsl/ts
        run: |
          npm ci
          npm test

  # Rust port: units + import-boundary guard + the dsl-core conformance gate. The crate is rlib-only
  # (no cdylib / wasm-bindgen target), so there is no wasm32 build step.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        working-directory: leadsheet/rust
        run: cargo test

      - name: MusicDSL Rust port + conformance
        working-directory: music-dsl/rust
        run: cargo test
