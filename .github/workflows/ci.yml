name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Python port: the pure language core + its in-package tests + the leadsheet & music-dsl conformance runners.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable, music-dsl first)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./music-dsl/python[dev]"
          pip install -e ./leadsheet/python pytest

      - name: MusicDSL tests
        run: pytest music-dsl/python/tests -q

      - name: Leadsheet unit tests + import-boundary guard
        run: pytest leadsheet/python/tests -q

      - name: Leadsheet conformance (Python reference)
        run: pytest conformance/leadsheet/runners/python -q

      - name: MusicDSL conformance (Python reference)
        run: pytest conformance/music-dsl/runners/python -q

  # TypeScript port: units + import-boundary guard + the leadsheet & music-dsl conformance runners.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install + test
        working-directory: leadsheet/ts
        run: |
          npm ci
          npm test

      - name: MusicDSL TS port + conformance
        working-directory: music-dsl/ts
        run: |
          npm ci
          npm test

  # Rust port: units + import-boundary guard + the conformance gate. The crate is rlib-only
  # (no cdylib / wasm-bindgen target), so there is no wasm32 build step.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        working-directory: leadsheet/rust
        run: cargo test

      - name: MusicDSL Rust port + conformance
        working-directory: music-dsl/rust
        run: cargo test

  # 3-way Python↔TS↔Rust differential fuzzer: seeded deterministic run (seed=1, N=500).
  # Catches port divergences that the conformance suite cannot cover because they require
  # generated inputs spanning the full chord-suffix grammar.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./music-dsl/python[dev]"

      - name: Install Node dependencies
        working-directory: music-dsl/ts
        run: npm ci

      - name: Step 1 — Generate seeded inputs (seed=1, N=500)
        run: python conformance/music-dsl/fuzz/gen.py 1 500

      - name: Step 2 — Python oracle
        run: python conformance/music-dsl/fuzz/oracle.py

      - name: Step 3 — Rust fuzz runner
        working-directory: music-dsl/rust
        run: CARGO_MANIFEST_DIR=$(pwd) cargo run --bin fuzz_runner --quiet

      - name: Step 4 — 3-way differential (vitest, 0 divergences required)
        working-directory: music-dsl/ts
        run: |
          NODE_PATH=node_modules node node_modules/.bin/vitest run \
            --config ../../conformance/music-dsl/fuzz/vitest.fuzz.config.ts
