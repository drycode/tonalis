name: docs

# Build the mkdocs-material documentation site (including the generated per-language
# API references) and deploy it to GitHub Pages on every push to main.
#
# NOTE: GitHub Pages only *serves* once this repository is public. The build job
# below always runs and must succeed; the deploy job is gated on the repo being
# public (see the `if:` on the `deploy` job) so it is a no-op until the make-public
# flip — at which point deploys start serving with no further change here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress prod deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Install packages for API generation (best-effort)
        run: |
          pip install pdoc
          pip install -e ./music-dsl/python -e ./tonalis/python
          npm --prefix music-dsl/ts ci || true
          npm --prefix music-dsl/ts i -D typedoc || true
          npm --prefix tonalis/ts ci || true
          npm --prefix tonalis/ts i -D typedoc || true

      - name: Generate API references
        run: bash docs/build_api.sh

      - name: Generate scale catalog table
        run: python docs/build_scales.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy only runs on the public repo. While the repo is private, GitHub Pages
  # cannot serve, so this job is skipped (the build above is the real gate). When
  # the repo is made public, deploys begin automatically with no edit here.
  deploy:
    needs: build
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
