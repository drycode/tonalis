site_name: Tonalis
site_description: >-
  A spec-driven, polyglot music-theory library — one normative conformance suite,
  three ports (Python reference, TypeScript, Rust) kept in lockstep by a
  differential fuzzer.
site_author: Tonalis
# Canonical site URL (GitHub Pages project site for drycode/tonalis). The deploy
# step is gated on the repo being public, so this only serves after the make-public flip.
site_url: https://drycode.github.io/tonalis/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

# Keep build tooling and internal design docs out of the published site (they live
# in docs/ for locality).
exclude_docs: |
  requirements.txt
  build_api.sh
  specs/

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Lead-sheet DSL: dsl.md
  - Theory model: theory.md
  - Scale catalog: scales.md
  - API reference: api.md
