[package]
name = "tonalis-music-dsl"
version = "0.1.0"
edition = "2021"
description = "MusicDSL — music-theory domain (notes, intervals, scale-degrees, chords, encoding). Port of the Python music_dsl reference."
readme = "README.md"
license = "MIT"
repository = "https://github.com/drycode/tonalis"

[lib]
name = "music_dsl"
crate-type = ["rlib"]

[[bin]]
name = "fuzz_runner"
path = "src/bin/fuzz_runner.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
