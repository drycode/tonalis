[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tonalis-music-dsl"
version = "0.1.2"
description = "Music-theory domain: notes, chords, intervals, scales, harmonic function."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  # typing_extensions: used in chord.py (Self) and numeric_chord.py (Self, TypeAlias)
  "typing_extensions>=4.10.0",
]

[project.urls]
Homepage = "https://github.com/drycode/tonalis"
Repository = "https://github.com/drycode/tonalis"

[project.optional-dependencies]
dev = [
  "pytest",
  "hypothesis",
  # attrs: test_static.py uses `from attr import s` for hypothesis strategies
  "attrs",
  "jsonschema",
]
# viz extra is intentionally omitted: no runtime module in music_dsl imports
# matplotlib, networkx, Pillow, or numpy. Those were transitive/dev-tool noise
# in an earlier build's setup.py freeze dump.

[tool.setuptools.packages.find]
include = ["music_dsl*"]
